services:
  - type: web
    name: medipulse-analytics
    env: node
    region: oregon
    plan: free
    rootDir: hospital-dashboard
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    autoDeploy: true
